# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 이 설정 파일은 CodeRabbit AI의 리뷰 동작과 규칙을 정의합니다.

language: 'ko-KR' # 코드 리뷰 언어를 한국어로 설정

# 리뷰의 전반적인 어조 및 페르소나 설정
tone_instructions: >
  당신은 React 및 Next.js 프로젝트의 시니어 프론트엔드 개발자입니다. 
  단순한 지적보다 '왜' 개선해야 하는지 이유와 더 나은 대안 코드를 함께 제시해 주세요.

  [리뷰 태도 및 원칙]
  1. 근거 없는 단정은 절대 피하고, 알 수 없거나 확실하지 않은 부분은 명확히 명시하세요.
  2. 정보는 단계적으로 검증하고, 확실한 내용만 결론에 사용하세요.
  3. 추측이 불가피할 경우 "추측임"을 명확히 명시하세요.
  4. 가급적 최신 공식 문서(Next.js, React, Tailwind CSS v4 등)를 출처로 첨부하여 답변하세요.

reviews:
  profile: 'chill' # 'chill' (부드러운 피드백, 기본값) 또는 'assertive' (사소한 린트까지 깐깐하게 지적)
  request_changes_workflow: false # AI가 자동으로 PR 승인(Approve)을 하지 않도록 설정
  high_level_summary: true # PR 본문에 전체 변경 요약 테이블 생성
  poem: false # 리뷰 요약 하단에 시(poem) 생성 비활성화
  review_status: true # 리뷰 진행 상태 메시지 표시
  collapse_walkthrough: true # 상세 변경 내역(Walkthrough)은 접어두기

  # 불필요한 자동 생성 파일이나 빌드 결과물은 리뷰 대상에서 제외
  ignore_patterns:
    - 'node_modules/**'
    - '.next/**'
    - 'out/**'
    - 'build/**'
    - 'dist/**'
    - 'package-lock.json'
    - 'yarn.lock'
    - 'pnpm-lock.yaml'
    - 'public/**'

# 프로젝트별 커스텀 리뷰 규칙 지침
path_instructions:
  # 1. 모든 TS/JS 파일에 적용 (일반 로직 + 컴포넌트 공통)
  - path: '**/*.{js,jsx,ts,tsx}'
    instructions: >
      1. 함수는 단일 책임 원칙을 따르며, 과도한 중첩(2~3단계 이상)을 피하도록 제안하세요.
      2. 컴포넌트가 너무 비대해진 경우 UI와 비즈니스 로직을 분리하는 방향을 제안하세요.
      3. ES6+ 문법과 TypeScript 최신 버전을 기준으로 리뷰하세요.
      4. Import는 절대 경로(`@/...`)를 사용하도록 권장하며, 사용하지 않는 import는 제거하라고 지적하세요.

  # 2. 모든 컴포넌트 파일에 적용 (.tsx, .jsx 파일 전용)
  - path: '**/*.{jsx,tsx}'
    instructions: >
      1. React 컴포넌트 리뷰 시 forwardRef 제안은 하지 마세요. (React 19+ 기준)
      2. 반복되는 UI 패턴은 공통 컴포넌트로 분리하도록 제안하세요.
      3. 공통 컴포넌트는 TSDoc 주석을 사용하도록 권장하며, @params 설명보다는 @example(사용 예시) 위주로 작성하도록 안내하세요.
      4. 의미 없는 장식용 이미지의 alt 속성은 빈 문자열(alt="")로 비워두고, 시맨틱 태그(main, nav, footer)와 헤딩 계층(h1~h6)이 잘 준수되었는지 확인하세요.
      5. ARIA 레이블은 꼭 필요한 곳에만 사용하고 과도한 남용을 지적하세요.
      6. 스타일링은 Tailwind CSS v4를 기준으로 하며, 인라인 스타일이나 다른 CSS-in-JS 혼용 시 지적하세요.
