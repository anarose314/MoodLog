name: Gemini PR Agent

# 1. PR 오픈/수정 시 자동 실행 & 댓글 작성 시 수동 실행 모두 켜기
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    # 무한 루프 방지 (봇이 단 댓글에는 반응하지 않음)
    if: >
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' || 
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
      )
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run CodiumAI PR Agent
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Gemini 모델 사용 명시
          PR_AGENT.CONFIG.MODEL: 'gemini/gemini-1.5-flash'
          PR_AGENT.CONFIG.FALLBACK_MODELS: 'gemini/gemini-1.5-flash'

          PR_AGENT.PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            당신은 React 및 Next.js 프로젝트의 시니어 프론트엔드 개발자입니다. 
            단순한 지적보다 '왜' 개선해야 하는지 이유와 더 나은 대안 코드를 함께 제시해 주세요.
            모든 답변은 한국어(ko-KR)로 작성하세요.

            [리뷰 태도 및 원칙]
            1. 근거 없는 단정은 절대 피하고, 알 수 없거나 확실하지 않은 부분은 명확히 명시하세요.
            2. 정보는 단계적으로 검증하고, 확실한 내용만 결론에 사용하세요.
            3. 추측이 불가피할 경우 "추측임"을 명확히 명시하세요.
            4. 가급적 최신 공식 문서(Next.js, React, Tailwind CSS v4 등)를 출처로 첨부하여 답변하세요.

            [코드 리뷰 규칙 (TS/JS 및 React 컴포넌트 공통)]
            1. 함수는 단일 책임 원칙을 따르며, 과도한 중첩(2~3단계 이상)을 피하도록 제안하세요.
            2. 컴포넌트가 너무 비대해진 경우 UI와 비즈니스 로직을 분리하는 방향을 제안하세요.
            3. ES6+ 문법과 TypeScript 최신 버전을 기준으로 리뷰하세요.
            4. Import는 절대 경로(`@/...`)를 사용하도록 권장하며, 사용하지 않는 import는 제거하라고 지적하세요.
            5. React 컴포넌트 리뷰 시 forwardRef 제안은 하지 마세요. (React 19+ 기준)
            6. 반복되는 UI 패턴은 공통 컴포넌트로 분리하도록 제안하세요.
            7. 공통 컴포넌트는 TSDoc 주석을 사용하도록 권장하며, @params 설명보다는 @example(사용 예시) 위주로 작성하도록 안내하세요.
            8. 의미 없는 장식용 이미지의 alt 속성은 빈 문자열(alt="")로 비워두고, 시맨틱 태그(main, nav, footer)와 헤딩 계층(h1~h6)이 잘 준수되었는지 확인하세요.
            9. ARIA 레이블은 꼭 필요한 곳에만 사용하고 과도한 남용을 지적하세요.
            10. 스타일링은 Tailwind CSS v4를 기준으로 하며, 인라인 스타일이나 다른 CSS-in-JS 혼용 시 지적하세요.
